plugins {
    id 'java'
    // Load one Paperweight implementation for every version module so Gradle's
    // configuration cache can restore its shared setup service consistently.
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24' apply false
}

group = 'com.swiftlicious.versionbridge'

repositories {
    mavenLocal()
    mavenCentral()
}

configurations {
    specialSource
}

dependencies {
    specialSource 'net.md-5:SpecialSource:1.11.5'
}

subprojects {
    group = rootProject.group
    version = rootProject.version
    apply plugin: 'java'
    apply plugin: 'eclipse'

    eclipse.project.name = "VersionBridge-${project.name}"

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:26.1.0'
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(26) }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Older servers must not be handed Java 26 bytecode just because the
        // latest adapter needs a Java 26 compiler.
        if (project.name ==~ /(?:paper|spigot)-v1_(?:17|18|19)_R\d+/ ||
                project.name ==~ /(?:paper|spigot)-v1_20_R[123]/) {
            options.release = 17
        } else if (project.name ==~ /(?:paper|spigot)-v1_(?:20|21)_R\d+/) {
            options.release = 21
        } else {
            options.release = 26
        }
    }
    sourceSets.all {
        allSource.exclude('**/.DS_Store')
        resources.exclude('**/.DS_Store')
    }
    tasks.withType(Jar).configureEach {
        exclude('**/.DS_Store')
    }
}

class CompactArchives {
    static void copyZip(File source, OutputStream output) {
        new java.util.zip.ZipFile(source).withCloseable { input ->
            new java.util.zip.ZipOutputStream(output).withCloseable { zip ->
                input.entries().each { original ->
                    def entry = new java.util.zip.ZipEntry(original)
                    entry.setMethod(java.util.zip.ZipEntry.STORED)
                    entry.setCompressedSize(original.size)
                    zip.putNextEntry(entry)
                    input.getInputStream(original).withCloseable { it.transferTo(zip) }
                    zip.closeEntry()
                }
            }
        }
    }
}

def adapters = subprojects.findAll {
    it.name ==~ /(?:paper|spigot)-(?:v\d+_\d+_R\d+|R\d+_\d+)/
}
def runtimeAdapters = adapters.collectEntries { adapter ->
    evaluationDependsOn(adapter.path)
    def jar = adapter.tasks.named('jar').flatMap { it.archiveFile }
    def mappedSpigot = adapter.name.startsWith('spigot-v')
    if (!mappedSpigot) return [(adapter.name): jar]

    // BuildTools compiles these adapters against Mojang names. Spigot's runtime
    // uses its own names, so publish the two-stage remapped jar instead.
    def spigotDependency = adapter.configurations.compileOnly.dependencies.find {
        it.group == 'org.spigotmc' && it.name == 'spigot'
    }
    def mcVersion = spigotDependency.version
    def mappingsRoot = "org.spigotmc:minecraft-server:${mcVersion}"
    def mojangMappings = adapter.configurations.detachedConfiguration(
        adapter.dependencies.create("${mappingsRoot}:maps-mojang@txt"))
    def spigotMappings = adapter.configurations.detachedConfiguration(
        adapter.dependencies.create("${mappingsRoot}:maps-spigot@csrg"))
    def mojangServer = adapter.configurations.detachedConfiguration(
        adapter.dependencies.create("org.spigotmc:spigot:${mcVersion}:remapped-mojang"))
    def obfuscatedServer = adapter.configurations.detachedConfiguration(
        adapter.dependencies.create("org.spigotmc:spigot:${mcVersion}:remapped-obf"))
    def obfuscated = layout.buildDirectory.file("remapped/${adapter.name}-obf.jar")
    def runtime = layout.buildDirectory.file("remapped/${adapter.name}.jar")

    def remapMojang = tasks.register("${adapter.name}-remapMojang", JavaExec) {
        dependsOn adapter.tasks.named('jar')
        // The matching server jar supplies inherited method names during remap.
        classpath = configurations.specialSource + mojangServer
        mainClass = 'net.md_5.specialsource.SpecialSource'
        inputs.file(jar)
        inputs.files(mojangMappings)
        outputs.file(obfuscated)
        doFirst { obfuscated.get().asFile.parentFile.mkdirs() }
        argumentProviders.add({ [
            '-i', jar.get().asFile.absolutePath,
            '-o', obfuscated.get().asFile.absolutePath,
            '-m', mojangMappings.singleFile.absolutePath,
            '-r', '-l', '-q'
        ] } as org.gradle.process.CommandLineArgumentProvider)
    }
    def remapSpigot = tasks.register("${adapter.name}-remapSpigot", JavaExec) {
        dependsOn remapMojang
        classpath = configurations.specialSource + obfuscatedServer
        mainClass = 'net.md_5.specialsource.SpecialSource'
        inputs.file(obfuscated)
        inputs.files(spigotMappings)
        outputs.file(runtime)
        argumentProviders.add({ [
            '-i', obfuscated.get().asFile.absolutePath,
            '-o', runtime.get().asFile.absolutePath,
            '-m', spigotMappings.singleFile.absolutePath,
            '-l', '-q'
        ] } as org.gradle.process.CommandLineArgumentProvider)
    }
    [(adapter.name): runtime]
}
def adapterDirectory = layout.buildDirectory.dir('dist/adapters').get().asFile
def manifestFile = layout.buildDirectory.file('dist/runtime-adapters.sha256').get().asFile
def hubVersion = version.toString()

tasks.register('adapterAssets', Sync) {
    dependsOn tasks.matching { it.name.endsWith('-remapSpigot') }
    dependsOn adapters.findAll { !it.name.startsWith('spigot-v') }.collect { it.tasks.named('jar') }
    runtimeAdapters.each { adapterName, jar ->
        from(jar) { rename { "${adapterName}.jar" } }
    }
    into(adapterDirectory)
    inputs.property('hubVersion', hubVersion)
    outputs.file(manifestFile)

    doLast {
        def checksums = []
        adapterDirectory.listFiles().findAll { it.name.endsWith('.jar') }.each { file ->
            def compact = new File(file.parentFile, file.name + '.compact')
            try {
                CompactArchives.copyZip(file, new FileOutputStream(compact))
                java.nio.file.Files.move(compact.toPath(), file.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally {
                compact.delete()
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[16384]
                for (int read; (read = input.read(buffer)) != -1;) digest.update(buffer, 0, read)
            }
            checksums.add("${java.util.HexFormat.of().formatHex(digest.digest())} ${file.name}")
        }
        manifestFile.setText("# version=${hubVersion}\n" + checksums.sort().join('\n') + '\n', 'UTF-8')
    }
}

tasks.named('build') {
    dependsOn tasks.named('adapterAssets')
}
